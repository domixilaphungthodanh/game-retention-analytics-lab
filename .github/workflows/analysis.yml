name: Simulated game analysis
on: workflow_dispatch
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m game_lab.prepare_data
      - run: python -m game_lab.analyze
      - run: python -m game_lab.execute_notebooks
      - uses: actions/upload-artifact@v4
        with:
          name: simulated-game-reports
          path: |
            outputs/
            notebooks/executed/
          retention-days: 14
